<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reader</title>
    <link rel="stylesheet" href="./styles.css?v=dark4" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Reader</h1>
      <div class="project-controls">
        <label class="field-label" for="project-path" hidden>Project path</label>
        <input
          id="project-path"
          type="text"
          placeholder="/Users/…/project"
          spellcheck="false"
          hidden
        />
        <button id="load-btn" type="button" aria-label="Load">Load</button>
        <span id="project-name" class="project-name" hidden></span>
        <label class="field-label" for="recents" id="recents-label">Recents</label>
        <select id="recents" aria-label="Recent projects">
          <option value="">Choose…</option>
        </select>
      </div>
    </header>

    <div class="banners">
      <div id="error" class="error" role="alert" hidden></div>
      <div id="snapshot-warning" class="snapshot-warning" hidden>
        A large Project can take a while to Load.
      </div>
      <div id="empty-maps" class="empty-maps" aria-live="polite" hidden>
        This Project has no language documents, Efforts, ADRs, or Out-of-scope records.
      </div>
    </div>

    <main class="layout">
      <aside class="map-sidebar">
        <div id="map-actions" class="map-actions" hidden>
          <div class="map-copy-controls" role="group" aria-label="Copy prompts">
            <button id="copy-skip-btn" type="button">Copy Skip prompt</button>
            <button id="copy-take-btn" type="button" hidden>Copy Take prompt</button>
          </div>
          <span id="copy-status" class="copy-status" role="status" aria-live="polite"></span>
        </div>
        <label class="filter-toggle">
          <input
            id="unresolved-filter"
            class="filter-toggle-input"
            type="checkbox"
            checked
            autocomplete="off"
            aria-label="Unresolved filter"
          />
          <span class="filter-toggle-text">Remaining work</span>
        </label>
        <nav id="map-list" class="map-list" aria-label="Map list"></nav>
      </aside>
      <section class="preview-pane">
        <div id="preview-caption" class="preview-caption">
          <span id="caption-text"></span>
          <div id="caption-actions" class="caption-actions"></div>
        </div>
        <div id="preview-body" class="preview-body">
          <textarea
            id="paste-composer"
            class="paste-composer"
            hidden
            aria-label="Paste markdown"
            placeholder="Paste GFM here."
          ></textarea>
          <div id="preview" class="preview preview-empty">
            <p class="preview-placeholder">Load a Project.</p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
